kind: Subgraph
version: v2
definition:
  name: app
  generator:
    rootPath: .
    namingConvention: graphql
  includePaths:
    - metadata
  envMapping:
    APP_DUCKDUCKGO_AUTHORIZATION_HEADER:
      fromEnv: APP_DUCKDUCKGO_AUTHORIZATION_HEADER
    APP_DUCKDUCKGO_READ_URL:
      fromEnv: APP_DUCKDUCKGO_READ_URL
    APP_DUCKDUCKGO_WRITE_URL:
      fromEnv: APP_DUCKDUCKGO_WRITE_URL
  connectors:
    - path: connector/duckduckgo/connector.yaml
      connectorLinkName: duckduckgo
