kind: Connector
version: v2
definition:
  name: duckduckgo
  subgraph: app
  source: hasura/python:v0.1.4
  context: .
  envMapping:
    HASURA_CONNECTOR_PORT:
      fromEnv: APP_DUCKDUCKGO_HASURA_CONNECTOR_PORT
    HASURA_SERVICE_TOKEN_SECRET:
      fromEnv: APP_DUCKDUCKGO_HASURA_SERVICE_TOKEN_SECRET
    OTEL_EXPORTER_OTLP_ENDPOINT:
      fromEnv: APP_DUCKDUCKGO_OTEL_EXPORTER_OTLP_ENDPOINT
    OTEL_SERVICE_NAME:
      fromEnv: APP_DUCKDUCKGO_OTEL_SERVICE_NAME
